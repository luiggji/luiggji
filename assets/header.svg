<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hi, I'm Luiz — Full-stack &amp; Mobile Developer, Software Engineering student">
<style>
.in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wave{transform-origin:118px 158px;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(14deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.p{opacity:0;animation:cycle 12s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes cycle{0%{opacity:0;transform:translateY(14px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-14px)}}
.led{animation:led 2.4s ease-in-out infinite}
@keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
</style>
<rect x=".5" y=".5" width="1279" height="319" rx="18" fill="#0D1117" stroke="#30363D"/>
<text class="in" x="84" y="92" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="3" fill="#3FB950">// HELLO, WORLD</text>
<g class="in d1">
<text class="wave" x="80" y="164" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="58">👋</text>
<text x="160" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#F0F6FC">Hi, I'm Luiz</text>
</g>
<text class="p" style="animation-delay:0s" x="84" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#58A6FF">I build full-stack products.</text><text class="p" style="animation-delay:3s" x="84" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#58A6FF">I build mobile experiences.</text><text class="p" style="animation-delay:6s" x="84" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#58A6FF">I design software architecture.</text><text class="p" style="animation-delay:9s" x="84" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#58A6FF">I build with generative AI.</text>
<text class="in d3" x="84" y="262" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8B949E">Full-stack &amp; Mobile Developer · Software Engineering student</text>
