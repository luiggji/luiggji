<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Luiz Felipe Borges — Full-stack &amp; Mobile Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#D97757" stop-opacity=".55"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".07"/></pattern>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
</defs>
<style>
.f{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.o1{animation:drift 14s ease-in-out infinite alternate}
.o2{animation:drift2 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(120px,30px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-140px,-20px)}}
.spark{transform-origin:1080px 160px;animation:spin 40s linear infinite}
.pulse{transform-origin:1080px 160px;animation:pulse 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.grow{animation:grow 1.2s cubic-bezier(.2,.7,.2,1) .7s both;transform-origin:80px 0}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="#0B0B10"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<ellipse class="o1" cx="240" cy="40" rx="420" ry="260" fill="url(#g1)"/>
<ellipse class="o2" cx="1100" cy="300" rx="420" ry="240" fill="url(#g2)"/>
<g class="pulse"><g class="spark"><g transform="translate(1080 160)" fill="#D97757"><path d="M0,-6 L4,-34.1 L0,-62 L-4,-34.1 Z" transform="rotate(0)"/><path d="M0,-6 L4,-25.3 L0,-46 L-4,-25.3 Z" transform="rotate(30)"/><path d="M0,-6 L4,-34.1 L0,-62 L-4,-34.1 Z" transform="rotate(60)"/><path d="M0,-6 L4,-25.3 L0,-46 L-4,-25.3 Z" transform="rotate(90)"/><path d="M0,-6 L4,-34.1 L0,-62 L-4,-34.1 Z" transform="rotate(120)"/><path d="M0,-6 L4,-25.3 L0,-46 L-4,-25.3 Z" transform="rotate(150)"/><path d="M0,-6 L4,-34.1 L0,-62 L-4,-34.1 Z" transform="rotate(180)"/><path d="M0,-6 L4,-25.3 L0,-46 L-4,-25.3 Z" transform="rotate(210)"/><path d="M0,-6 L4,-34.1 L0,-62 L-4,-34.1 Z" transform="rotate(240)"/><path d="M0,-6 L4,-25.3 L0,-46 L-4,-25.3 Z" transform="rotate(270)"/><path d="M0,-6 L4,-34.1 L0,-62 L-4,-34.1 Z" transform="rotate(300)"/><path d="M0,-6 L4,-25.3 L0,-46 L-4,-25.3 Z" transform="rotate(330)"/></g></g></g>
<text class="f" x="80" y="104" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="3.5" fill="#D97757">SOFTWARE ENGINEERING · UNIFIO</text>
<text class="f d1" x="78" y="178" font-family="Georgia,'Times New Roman',serif" font-size="68" fill="#F5F0E8">Luiz Felipe Borges</text>
<rect class="grow" x="80" y="202" width="360" height="2" fill="url(#line)"/>
<text class="f d2" x="80" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#C9C4BC">Full-stack &amp; Mobile Developer</text>
</g>
<rect x=".5" y=".5" width="1279" height="319" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
